[package]
name = "xhamp-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
